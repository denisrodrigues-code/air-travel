    <style>
        body {
            font-family: 'Cabin';
            margin: 0;
            padding: 0;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.2), transparent 100px);
            display: flex;
            justify-content: center; /* Centers horizontally */
            align-items: center; /* Centers vertically */
            min-height: 100vh; /* Ensures full height */
        }
        header {
            position: absolute; /* Keep header outside the flow */
            top: 1rem; /* Fixed position from the top */
            display: flex;244
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background-color: #ffffff;
            border-radius: 50px;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            box-shadow: 0 16px 32px 0 rgba(0, 0, 0, 0.1);
        }
        .logo {
            display: flex;
            align-items: center;
        }
        .logo img {
            height: 16px;
        }
        .content {
            max-width: 1200px;
            text-align: center;
            padding: 2rem;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 25px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
        }
        .content h1 {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }
        .content p {
            font-size: 16px;
            color: #555;
            margin: 1rem 0;
        }
        footer {
            position: absolute; /* Keep footer outside the flow */
            bottom: 1rem; /* Fixed position from the bottom */
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            background-color: #e5e5e5;
            font-size: 14px;
            border-radius: 25px;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            box-shadow: none;
        }
        .footer-left {
            font-size: 14px;
            color: #333;
        }
        .footer-left b {
            font-weight: bold;
        }
        .footer-right img {
            height: 30px;
        }
    </style>
</head>
